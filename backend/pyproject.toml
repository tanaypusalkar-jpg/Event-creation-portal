[project]
name = "event-workshop-portal-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.35",
  "pymysql>=1.2.3",
  "alembic>=1.13.3",
  "pydantic-settings>=2.5.2",
  "email-validator>=2.2.0",
  "PyJWT>=2.9.0",
  "pwdlib[argon2]>=0.2.0",
  "slowapi>=0.1.9",
  "pymysql>=1.2.3",
  "cryptography>=50.0.2",
]
[dependency-groups]
dev = ["pytest>=8.3.3", "httpx>=0.27.2", "ruff>=0.6.9"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.pytest.ini_options]
testpaths = ["tests"]
